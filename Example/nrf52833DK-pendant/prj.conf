# Logging UART0 output
CONFIG_LOG=y
# Log output mode: immediate or deferred
CONFIG_LOG_MODE_IMMEDIATE=n

# Hardware packages
CONFIG_PACKAGE_LED=y

# UART1 as RS485 transceiver link (see boards overlay uart1 + rs485-de-gpios)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PACKAGE_RS485=y

# SPI1 bus (drives the ILI9341 display, see boards overlay)
CONFIG_SPI=y

# GPIO subsystem (RS485 direction control pin, display DC/RESET pins)
CONFIG_GPIO=y

# Display subsystem + ILI9341 driver
CONFIG_DISPLAY=y
CONFIG_ILI9341=y

# LVGL graphics library
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_COLOR_DEPTH_16=y
