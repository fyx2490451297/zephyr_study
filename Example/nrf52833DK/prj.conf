# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Hardware packages
CONFIG_PACKAGE_LED=y
# CONFIG_PACKAGE_KEY is disabled until key hardware is wired

# UART subsystem — required by CONFIG_PACKAGE_MCU_TRANSPORT
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Application modules
CONFIG_PACKAGE_LED_CTRL=y
CONFIG_PACKAGE_BLE_ADV_DEMO=n
CONFIG_PACKAGE_ADV_CONN_DEMO=n
CONFIG_PACKAGE_BLE_SCAN_CONN_DEMO=n
CONFIG_PACKAGE_MCU_TRANSPORT=y
CONFIG_PACKAGE_SEM_DEMO=n
CONFIG_PACKAGE_KMSQ_DEMO=n
CONFIG_PACKAGE_KMUTEX_DEMO=n
# GATT/ATT server demo — disable PACKAGE_BLE_SCAN_CONN_DEMO when enabling this
CONFIG_PACKAGE_GATT_SERVER_DEMO=n

# ============================================================
# BLE OTA production packages
# To run the full OTA system, set the block below to =y and
# disable all *_DEMO packages (they each call bt_enable()).
# ============================================================
CONFIG_PACKAGE_BLE_CORE=y
CONFIG_PACKAGE_BLE_ADV=y
CONFIG_PACKAGE_BLE_CONN=y
CONFIG_PACKAGE_BLE_GATT_SERVICE=y
CONFIG_PACKAGE_BLE_GATT_OTA_SERVICE=y
# Optional: enable when acting as GATT Central (scanner/initiator)
CONFIG_PACKAGE_BLE_GATT_CLIENT=n
# LED3/LED4 BLE remote control (requires BLE core + conn + LED packages)
CONFIG_PACKAGE_BLE_LED_CTRL_SERVICE=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="nRF52833 BLE Demo"
CONFIG_BT_RX_STACK_SIZE=4096

# Thread analyze
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y