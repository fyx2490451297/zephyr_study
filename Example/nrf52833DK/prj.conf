# Logging
# Note: CONFIG_LOG_MODE_IMMEDIATE is incompatible with the BLE software Link
# Layer controller (CONFIG_BT), so deferred logging (the default) is used.
CONFIG_LOG=y

# Enable floating-point formatting ("%f") in cbprintf/snprintf. Without this,
# Zephyr's minimal printf backend prints the literal placeholder "*float*"
# instead of the actual value (needed by pipe_bender_ui's "%.1f" labels).
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware packages
CONFIG_PACKAGE_LED=y
CONFIG_PACKAGE_LCD_BACKLIGHT=y
# CONFIG_PACKAGE_KEY is disabled until key hardware is wired

# UART subsystem — required by CONFIG_PACKAGE_MCU_TRANSPORT
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# Kernel events subsystem — required by CONFIG_PACKAGE_EVENT_DEMO (k_event API)
CONFIG_EVENTS=y

# Application modules
CONFIG_PACKAGE_LED_CTRL=y
CONFIG_PACKAGE_BLE_ADV_DEMO=n
CONFIG_PACKAGE_ADV_CONN_DEMO=n
CONFIG_PACKAGE_BLE_SCAN_CONN_DEMO=n
CONFIG_PACKAGE_MCU_TRANSPORT=n
CONFIG_PACKAGE_SEM_DEMO=n
CONFIG_PACKAGE_FIFO_DEMO=n
CONFIG_PACKAGE_EVENT_DEMO=n
CONFIG_PACKAGE_WORK_QUEUE_DEMO=n
CONFIG_PACKAGE_POLL_DEMO=n
CONFIG_PACKAGE_KMSQ_DEMO=n
CONFIG_PACKAGE_KMUTEX_DEMO=n
CONFIG_PACKAGE_ATOMIC_DEMO=n
CONFIG_PACKAGE_SPINLOCK_DEMO=n
# GATT/ATT server demo — disable PACKAGE_BLE_SCAN_CONN_DEMO when enabling this
CONFIG_PACKAGE_GATT_SERVER_DEMO=n

# ============================================================
# ILI9341 LCD + LVGL UI (package_lcd_ui)
# ============================================================
# SPI bus + MIPI-DBI host controller driving the ILI9341 panel
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y

# Display subsystem (auto-selects CONFIG_ILI9341 from devicetree)
CONFIG_DISPLAY=y

# LVGL core + Zephyr integration
CONFIG_LVGL=y
CONFIG_PACKAGE_LCD_UI=y

# Serial FPS/CPU/RAM system monitor (package_sys_monitor)
CONFIG_PACKAGE_SYS_MONITOR=y

# 16-bit color depth to fit RAM budget (SPI byte-swap needed for MSB-first
# transmission to the panel; raw image asset data itself is NOT pre-swapped)
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# Rendering buffer: 10% of the 320x240 frame is enough for partial refresh
# and keeps RAM usage low alongside the BLE stack.
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_BITS_PER_PIXEL=16

# LVGL object/style memory pool — default 2KB is too small for this UI's
# ~30 widgets (boxes, labels, buttons, images).
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Fonts used by the pipe-bender UI (montserrat_14/26/12)
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_26=y

# Image decoder support for the LV_IMG_CF_TRUE_COLOR_ALPHA battery/gauge icons
CONFIG_LV_USE_IMG=y

# Thread analyze
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y